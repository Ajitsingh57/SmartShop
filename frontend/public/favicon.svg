<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.1" />
    </linearGradient>

    <!-- Brand Flame / Orange Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c37" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Electric Lightning Accent -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="50" cy="50" r="30" fill="#f97316" opacity="0.15" filter="url(#orangeGlow)" />

  <!-- Shopping Bag Motif -->
  <g filter="url(#subtleShadow)">
    <!-- Bag Handle -->
    <path 
      d="M38 34 C38 24, 62 24, 62 34" 
      fill="none" 
      stroke="url(#sparkGrad)" 
      stroke-width="5" 
      stroke-linecap="round" 
    />
    
    <!-- Bag Body -->
    <path 
      d="M26 36 L74 36 C77.5 36, 80 39, 78.8 43 L72.2 78 C71.3 82.5, 67.5 85.5, 63 85.5 L37 85.5 C32.5 85.5, 28.7 82.5, 27.8 78 L21.2 43 C20 39, 22.5 36, 26 36 Z" 
      fill="url(#brandGrad)" 
    />

    <!-- Dynamic "S" / Lightning Bolt Monogram inside Bag -->
    <path 
      d="M56 44 L41 57 L48 57 L44 75 L59 62 L52 62 Z" 
      fill="url(#sparkGrad)" 
    />
  </g>
</svg>